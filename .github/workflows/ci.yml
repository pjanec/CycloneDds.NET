name: CI

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # Linux: build the native CycloneDDS libraries + idlc, then build and test the
  # managed code against them. Building the managed solution exercises the
  # build-time IDL code generator (idlc) on Linux end-to-end, and the runtime
  # tests exercise the DllImport("ddsc") -> libddsc.so path. The native artifacts
  # are uploaded for the Windows pack job to fold into the cross-platform package.
  # ---------------------------------------------------------------------------
  linux-build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0 # Required for Nerdbank.GitVersioning to determine version
        submodules: recursive

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        # net8.0 is the target framework, but the code uses C# 13 language
        # features (e.g. ref structs in async methods), which require the .NET 10
        # SDK's compiler. Install both: the 10.0 SDK builds, the 8.0 runtime runs
        # the net8.0 test assemblies.
        dotnet-version: |
          8.0.x
          10.0.x

    - name: Display Tools Versions
      run: |
        dotnet --version

    # The native build only depends on the pinned Cyclone DDS submodule, our native/
    # sources, the build script and the build container below, so it is cached instead
    # of rebuilt for every managed-code change. The workflow file is part of the key
    # because it defines the container and its packages.
    - name: Resolve native cache key
      id: native-key
      shell: bash
      run: echo "submodule=$(git rev-parse HEAD:cyclonedds)" >> "$GITHUB_OUTPUT"

    - name: Cache native linux-x64 build
      id: native-cache
      uses: actions/cache@v4
      with:
        path: artifacts/native/linux-x64
        key: native-linux-x64-ubuntu22.04-${{ steps.native-key.outputs.submodule }}-${{ hashFiles('native/**', 'build/native-linux.sh', '.github/workflows/ci.yml') }}

    # The native libraries are built inside an ubuntu:22.04 container rather than on
    # the runner (ubuntu-latest): a binary only runs on distributions whose glibc is at
    # least the build host's, and ubuntu-latest's glibc 2.39 would exclude Ubuntu 22.04,
    # Debian 12 and RHEL 9. Everything else (managed build, tests) stays on the runner.
    # The container's downloaded .deb packages are cached between runs: package download
    # speed from GitHub runners varies a lot (seen: 84 kB/s, i.e. ~20 min for ~100 MB),
    # and with the cache a run downloads nothing once a previous run succeeded.
    - name: Cache apt packages for the native build container
      if: steps.native-cache.outputs.cache-hit != 'true'
      uses: actions/cache@v4
      with:
        path: .apt-cache
        key: apt-ubuntu22.04-${{ hashFiles('.github/workflows/ci.yml') }}
        restore-keys: apt-ubuntu22.04-

    # libssl-dev: headers for building the DDS Security plugins (OpenSSL is not shipped).
    - name: Build Native (linux-x64, in ubuntu:22.04)
      if: steps.native-cache.outputs.cache-hit != 'true'
      # Normally about a minute; fail fast (with a readable log) instead of hanging
      # until the 6-hour job limit.
      timeout-minutes: 20
      shell: bash
      run: |
        mkdir -p .apt-cache
        docker run --rm -v "$PWD:/src" -v "$PWD/.apt-cache:/var/cache/apt/archives" -w /src ubuntu:22.04 bash -euc '
          # Use the Azure-hosted Ubuntu mirror the GitHub runners themselves use: the
          # default archive.ubuntu.com can be very slow from GitHub (seen: 15 min).
          sed -i -e "s|http://archive.ubuntu.com|http://azure.archive.ubuntu.com|g" \
                 -e "s|http://security.ubuntu.com|http://azure.archive.ubuntu.com|g" /etc/apt/sources.list
          # Keep downloaded packages (the image deletes them after install by default).
          rm -f /etc/apt/apt.conf.d/docker-clean
          apt-get update
          # Cyclone DDS and native/ are plain C: gcc + libc6-dev + make instead of
          # build-essential, which also pulls in g++, perl and dpkg-dev.
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            cmake gcc libc6-dev make patchelf ca-certificates libssl-dev pkg-config
          build/native-linux.sh Release'
        # The container ran as root; hand the outputs back to the runner user.
        sudo chown -R "$(id -u):$(id -g)" artifacts build .apt-cache

    # Guard the glibc baseline: fail if any staged binary needs a newer glibc than
    # ubuntu:22.04 provides (2.35), e.g. after a base image or toolchain change.
    - name: Check glibc baseline (<= 2.35)
      shell: bash
      run: |
        max=$(objdump -T artifacts/native/linux-x64/*.so artifacts/native/linux-x64/idlc \
              | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -V | tail -1)
        echo "Highest required glibc: $max"
        if [ "$(printf '%s\n' "$max" 2.35 | sort -V | tail -1)" != "2.35" ]; then
          echo "::error::Native binaries require glibc $max (> 2.35)"; exit 1
        fi

    - name: Build Managed Code
      run: dotnet build CycloneDDS.NET.Core.slnf -c Release

    - name: Run Runtime Tests
      run: dotnet test tests/CycloneDDS.Runtime.Tests/CycloneDDS.Runtime.Tests.csproj -c Release --no-build --logger "console;verbosity=normal"

    - name: Upload linux-x64 Native Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: native-linux-x64
        path: artifacts/native/linux-x64/*
        if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Windows: full build, test and pack via the existing pack.ps1 pipeline
  # (builds win-x64 native, builds core, runs runtime tests, packs both the
  # CycloneDDS.NET and DdsMonitor packages, builds the examples). The linux-x64
  # native artifacts produced above are downloaded first so the packed NuGet
  # carries both win-x64 and linux-x64 runtime assets.
  # ---------------------------------------------------------------------------
  build:
    runs-on: windows-latest
    needs: [ linux-build ]

    env:
      # This ensures the build script can find CMake if not in default path (though it usually is on runners)
      CMAKE_GENERATOR: "Visual Studio 17 2022"

    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0 # Required for Nerdbank.GitVersioning to determine version
        submodules: recursive

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        # net8.0 is the target framework, but the code uses C# 13 language
        # features (e.g. ref structs in async methods), which require the .NET 10
        # SDK's compiler. Install both: the 10.0 SDK builds, the 8.0 runtime runs
        # the net8.0 test assemblies.
        dotnet-version: |
          8.0.x
          10.0.x

    - name: Display Tools Versions
      run: |
        dotnet --version
        cmake --version

    - name: Download linux-x64 Native Artifacts
      uses: actions/download-artifact@v4
      with:
        name: native-linux-x64
        path: artifacts/native/linux-x64/

    # Same native build cache as the Linux job. OpenSSL is only needed to BUILD the
    # security plugins (the image ships it under C:\Program Files\OpenSSL); it is not
    # packaged. The security tests preload it from there at test time.
    - name: Resolve native cache key
      id: native-key
      shell: pwsh
      run: |
        "submodule=$(git rev-parse HEAD:cyclonedds)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        "image=$($env:ImageOS)-$($env:ImageVersion)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

    - name: Cache native win-x64 build
      id: native-cache
      uses: actions/cache@v4
      with:
        path: artifacts/native/win-x64
        key: native-win-x64-${{ steps.native-key.outputs.image }}-${{ steps.native-key.outputs.submodule }}-${{ hashFiles('native/**', 'build/native-win.ps1') }}

    - name: Build, Test, and Pack
      shell: pwsh
      run: .\build\pack.ps1 ${{ steps.native-cache.outputs.cache-hit == 'true' && '-SkipNativeBuild' || '' }}

    - name: Smoke-test the packed package (Windows)
      shell: pwsh
      run: .\build\test-package.ps1

    - name: Upload win-x64 Native Artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: native-win-x64
        path: artifacts/native/win-x64/*
        if-no-files-found: warn

    - name: Upload NuGet Packages
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: nuget-packages
        path: artifacts/nuget/*.nupkg
        if-no-files-found: warn

    - name: Upload Symbol Packages
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: symbol-packages
        path: artifacts/nuget/*.snupkg
        if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Linux: prove the *cross-platform* package (packed on Windows above) actually
  # works on Linux. Downloads the finished 'nuget-packages' artifact and consumes
  # it as a real NuGet package via build/test-package.sh: restore -> the bundled
  # Linux idlc runs code generation -> DllImport resolves libddsc.so -> pub/sub
  # round-trip, then the ddsmonitor tool is installed and served. No native build.
  # ---------------------------------------------------------------------------
  linux-verify:
    runs-on: ubuntu-latest
    needs: [ build ]

    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0 # Required for Nerdbank.GitVersioning (applies to the smoke-test project)

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: |
          8.0.x
          10.0.x

    - name: Download cross-platform packages
      uses: actions/download-artifact@v4
      with:
        name: nuget-packages
        path: artifacts/nuget/

    - name: Smoke-test the cross-platform package (Linux)
      shell: bash
      run: build/test-package.sh

  # ---------------------------------------------------------------------------
  # Publish to NuGet.org — ONLY on a version tag (vX.Y.Z), and ONLY after the
  # cross-platform package has been verified on both Windows (build) and Linux
  # (linux-verify). Pushes the packages produced by the build job (both
  # CycloneDDS.NET and CycloneDDS.NET.DdsMonitor) plus their symbol packages.
  #
  # Requires a repository secret named NUGET_API_KEY:
  #   Repo -> Settings -> Secrets and variables -> Actions -> New repository secret.
  # To release: create a GitHub Release with a tag matching the NBGV version of
  # the target commit (e.g. v0.3.2 — check with `nbgv get-version` first).
  # ---------------------------------------------------------------------------
  publish:
    runs-on: ubuntu-latest
    needs: [ build, linux-verify ]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 10.0.x

    - name: Download packages
      uses: actions/download-artifact@v4
      with:
        name: nuget-packages
        path: artifacts/nuget/

    - name: Download symbol packages
      uses: actions/download-artifact@v4
      with:
        name: symbol-packages
        path: artifacts/nuget/

    - name: Push to NuGet.org
      shell: bash
      env:
        NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      run: |
        if [ -z "$NUGET_API_KEY" ]; then
          echo "::error::NUGET_API_KEY secret is not set — cannot publish." >&2
          exit 1
        fi
        # dotnet expands the wildcard and auto-pushes the matching .snupkg for each .nupkg.
        dotnet nuget push "artifacts/nuget/*.nupkg" \
          --api-key "$NUGET_API_KEY" \
          --source https://api.nuget.org/v3/index.json \
          --skip-duplicate
